[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "databoarder"
version = "0.1.0"
description = "A Python data visualization library with a live web dashboard — tensors, meshes, and animations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "groves152" }]

dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "numpy>=1.24",
    "msgpack>=1.0",
    "pillow>=10.0",       # image encode/decode
    "websockets>=12.0",   # used by uvicorn/starlette internally
]

[project.optional-dependencies]
jax = ["jax", "jaxlib"]
torch = ["torch"]
h5py = ["h5py>=3.9"]     # large animation frame cache
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",        # test fastapi routes
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
databoarder = "databoarder.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["databoarder"]
artifacts = ["databoarder/static"]   # built frontend ends up here

[tool.hatch.build.hooks.custom]
# builds the frontend before packaging — see hatch_build.py
path = "hatch_build.py"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
